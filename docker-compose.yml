# Local Postgres for development: npm run db:up
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jupeang
      POSTGRES_PASSWORD: jupeang
      POSTGRES_DB: jupeang
    ports:
      - "5432:5432"
    volumes:
      - jupeang-db:/var/lib/postgresql/data

volumes:
  jupeang-db:
